[project]
name = "myphoto"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.19",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "pillow>=10.2",
  "pillow-heif>=0.15",
  "rawpy>=0.19",
  "python-multipart>=0.0.9",
  "tomli>=2.0; python_version<'3.11'",
  "click>=8.1",
  # 智能标签（tags upgrade Phase 1）。openvino 锁 2024.6.0（2026.x API 不兼容）；
  # 不要装 optimum（会升级 openvino 破坏环境）。模型文件本身不进 git。
  # 故意不依赖 torch：推理走 OpenVINO/onnxruntime，transformers 仅用
  # CLIPProcessor（numpy 路径）；无 torch 时 transformers 的 advisory 警告
  # 已在 tagger.py 用 TRANSFORMERS_NO_ADVISORY_WARNINGS 抑制。
  "numpy>=1.26",
  "openvino==2024.6.0",
  "onnxruntime>=1.31",
  "insightface>=2.1",
  "opencv-python>=4.8",
  "transformers>=4.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "anyio>=4"]

[project.scripts]
myphoto = "myphoto.cli:main"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
